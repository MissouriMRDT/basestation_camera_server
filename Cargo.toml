[package]
name = "basestation_camera_server"
version = "0.1.0"
edition = "2021"

[dependencies]
webrtc = "0.12.0"
tokio = { version = "1.32.0", features = ["full"] }
env_logger = "0.11.3"
tokio-util = { version = "0.7", features = ["codec"] }
anyhow = "1"
chrono = "0.4.28"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-tungstenite = "0.26.2"
base64 = "0.22.1"
futures-util = "0.3.31"
toml = "0.8.20"
